<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/games.ico" type="image/x-icon">
    <title>Tags HTML</title>
</head>
<body>
   <h1>Tags em HTML</h1> 
   <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mause sobre os termos para descobrir qual tag deverar utilizar em cada caso.</p>
   <ul type="square">
    <li><abbr title="Use a tag <p>">Parágrafos</abbr></li>
    <li><abbr title="Use as tags <h1> a <h6>">Títulos</abbr></li>
    <li><abbr title="Use a tag < img src=>(precisa do atributo src).">Imagens</abbr></li>
    <li><abbr title="Use a tag <abbr title ></abbr> ">Abreviações</abbr></li>
    <li><abbr title="Código-fonte é o conjunto de palavras ou símbolos escritos de forma ordenada">Códigos - Fonte</abbr></li>
    <li><abbr title="<ol> (ordered list) para iniciar a lista e a tag <li> (list item) para cada item numerado automaticamente.">Listas Numeradas</abbr></li>
    <li><abbr title="<ul> para itens não ordenados (marcadores disc, circle, square) e <ol> para ordenados (números, letras, romanos), definidos com <li>. Estruturas incluem aninhamento (listas dentro de listas) e listas de descrição (<dl>), permitindo menus, listas de tarefas e hierarquias, personalizáveis com CSS list-style">Listas com demarcadores</abbr></li>
   </ul>
</body>
</html>
